name: Build iOS IPA (Leo's Tubi)

on:
  push:
    branches:
      - main
      - leos-tubi-ios
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Compile Leos Tubi iOS (.ipa)
    runs-on: macos-15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version
          swift -version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install and Prebuild iOS
        run: |
          bun link
          bun install --frozen-lockfile
          bun bundle:es
          bun expo prebuild -p ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install

      - name: Build iOS Application with Xcode (Unsigned / Ad-hoc)
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          PROJECT=$(ls -d *.xcodeproj | head -n 1)
          # Get scheme name directly from xcodeproj
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "Using Workspace: $WORKSPACE"
          echo "Using Project: $PROJECT"
          echo "Using Scheme: $SCHEME"

          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into .IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching all .app folders in build:"
            find build -name "*.app" -type d
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Packaging application from: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -9 "Leos_Tubi.ipa" Payload
          echo "Created Leos_Tubi.ipa successfully:"
          ls -lh Leos_Tubi.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leos_Tubi_iOS_IPA
          path: ios/Leos_Tubi.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Leo's Tubi iOS v${{ github.run_number }}"
          tag_name: "v1.0.${{ github.run_number }}"
          files: ios/Leos_Tubi.ipa
          body: |
            ## 📱 Leo's Tubi para iOS (iPhone & iPad)
            Compilación nativa para iOS (React Native + Swift + Xcode):
            - Pantalla de inicio y login VIP integrada (Leo Streaming TV)
            - Motor de YouTube & YouTube Music sin anuncios
            - Reproducción en segundo plano y Picture-in-Picture (PiP)
            - Controles nativos en pantalla de bloqueo
            
            ### 🚀 Cómo instalar en tu iPhone:
            1. **Vía Sideloadly (PC):** Descarga el archivo `Leos_Tubi.ipa`, conecta tu iPhone por USB y arrástralo en Sideloadly.
            2. **Vía Certificado OTA (Web):** Sube el `.ipa` a tu servidor de firma web.
            3. **Vía TrollStore / AltStore / Esign / Scarlet.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
