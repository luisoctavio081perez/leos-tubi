name: Build iOS IPA (Leo's Tubi)

on:
  push:
    branches:
      - leos-tubi-ios
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile Leos Tubi iOS (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: |
          bun install || npm install --legacy-peer-deps

      - name: Bundle Content Scripts
        run: |
          bun run bundle:es || npm run bundle:es

      - name: Expo Prebuild (Generate iOS Native Project)
        run: |
          npx expo prebuild -p ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install

      - name: Build iOS Application with Xcode
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="NouTube"
          echo "Building workspace $WORKSPACE with scheme $SCHEME..."

          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload and Create .IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -9 "Leos_Tubi.ipa" Payload
          echo "IPA created successfully: Leos_Tubi.ipa"
          ls -lh Leos_Tubi.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leos_Tubi_iOS_IPA
          path: Leos_Tubi.ipa
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Leos_Tubi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
